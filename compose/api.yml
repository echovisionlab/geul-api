name: geul-api

services:
  api:
    image: ${GEUL_API_IMAGE:?set GEUL_API_IMAGE to a full image reference}
    container_name: geul-api
    ports:
      - '${GEUL_API_BIND_HOST:-127.0.0.1}:${GEUL_API_PUBLIC_PORT:-8000}:8000'
    environment:
      PORT: ${GEUL_API_PORT:-8000}
      MCP_PRIVATE_PORT: ${GEUL_API_MCP_PRIVATE_PORT:-8001}
      AUTH_HEADER_NAME: ${AUTH_HEADER_NAME:?set AUTH_HEADER_NAME}
      INTERNAL_SERVICE_HEADER_NAME: ${INTERNAL_SERVICE_HEADER_NAME:?set INTERNAL_SERVICE_HEADER_NAME}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?set SESSION_COOKIE_NAME}
      DATABASE_DSN: ${GEUL_DATABASE_DSN:?set GEUL_DATABASE_DSN}
      SES_EVENT_SNS_TOPIC_ARN: ${GEUL_SES_EVENT_SNS_TOPIC_ARN:-}
      KRATOS_URL: ${GEUL_KRATOS_URL:-http://geul-identity-kratos-prod:4433}
      KRATOS_ADMIN_URL: ${GEUL_KRATOS_ADMIN_URL:-http://geul-identity-kratos-prod:4434}
      EDITOR_COLLAB_URL: ${GEUL_EDITOR_COLLAB_URL:?set GEUL_EDITOR_COLLAB_URL}
      S3_ENDPOINT: ${GEUL_S3_ENDPOINT:?set GEUL_S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${GEUL_S3_PUBLIC_ENDPOINT:?set GEUL_S3_PUBLIC_ENDPOINT}
      S3_MEDIA_BUCKET: ${GEUL_S3_MEDIA_BUCKET:?set GEUL_S3_MEDIA_BUCKET}
      S3_CACHE_BUCKET: ${GEUL_S3_CACHE_BUCKET:?set GEUL_S3_CACHE_BUCKET}
      S3_REGION: ${GEUL_S3_REGION:?set GEUL_S3_REGION}
      S3_ACCESS_KEY_ID: ${GEUL_S3_ACCESS_KEY_ID:?set GEUL_S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${GEUL_S3_SECRET_ACCESS_KEY:?set GEUL_S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${GEUL_S3_FORCE_PATH_STYLE:-false}
      CDN_URL: ${GEUL_CDN_URL:?set GEUL_CDN_URL}
      MEDIA_URL: ${GEUL_MEDIA_URL:?set GEUL_MEDIA_URL}
      CLOUDFLARE_ZONE_ID: ${GEUL_CLOUDFLARE_ZONE_ID:?set GEUL_CLOUDFLARE_ZONE_ID}
      CLOUDFLARE_API_TOKEN: ${GEUL_CLOUDFLARE_API_TOKEN:?set GEUL_CLOUDFLARE_API_TOKEN}
      CLOUDFLARE_API_URL: ${GEUL_CLOUDFLARE_API_URL:-https://api.cloudflare.com/client/v4}
      SPICEDB_ENDPOINT: ${GEUL_SPICEDB_ENDPOINT:-spicedb.geul-services.svc.cluster.local:50051}
      SPICEDB_GRPC_PRESHARED_KEY: ${GEUL_SPICEDB_GRPC_PRESHARED_KEY:?set GEUL_SPICEDB_GRPC_PRESHARED_KEY}
      SPICEDB_ALLOW_INSECURE: ${GEUL_SPICEDB_ALLOW_INSECURE:-true}
      CORS_ORIGINS: ${GEUL_CORS_ORIGINS:?set GEUL_CORS_ORIGINS}
      MAXMIND_ACCOUNT_ID: ${GEUL_MAXMIND_ACCOUNT_ID:?set GEUL_MAXMIND_ACCOUNT_ID}
      MAXMIND_LICENSE_KEY: ${GEUL_MAXMIND_LICENSE_KEY:?set GEUL_MAXMIND_LICENSE_KEY}
      SITE_ORIGIN: ${GEUL_SITE_ORIGIN:?set GEUL_SITE_ORIGIN}
      AUTH_CODE_RESEND_COOLDOWN_SECONDS: ${GEUL_AUTH_CODE_RESEND_COOLDOWN_SECONDS:-60}
      AUTH_CODE_LIFESPAN_SECONDS: ${GEUL_AUTH_CODE_LIFESPAN_SECONDS:-900}
      AUTH_CODE_ADDRESS_HOURLY_LIMIT: ${GEUL_AUTH_CODE_ADDRESS_HOURLY_LIMIT:-6}
      AUTH_CODE_IP_TEN_MINUTE_LIMIT: ${GEUL_AUTH_CODE_IP_TEN_MINUTE_LIMIT:-20}
      AUTH_CODE_GLOBAL_MINUTE_LIMIT: ${GEUL_AUTH_CODE_GLOBAL_MINUTE_LIMIT:-1000}
      TOKEN_SIGNING_SECRET: ${GEUL_TOKEN_SIGNING_SECRET:?set GEUL_TOKEN_SIGNING_SECRET}
      MEDIA_SIGNING_SECRET: ${GEUL_MEDIA_SIGNING_SECRET:?set GEUL_MEDIA_SIGNING_SECRET}
      EDITOR_IMAGE_MAX_SIZE_BYTES: ${GEUL_EDITOR_IMAGE_MAX_SIZE_BYTES:-31457280}
      ARGON2_MEMORY: ${GEUL_ARGON2_MEMORY:-19456}
      ARGON2_ITERATIONS: ${GEUL_ARGON2_ITERATIONS:-2}
      ARGON2_PARALLELISM: ${GEUL_ARGON2_PARALLELISM:-1}
      ARGON2_SALT_LENGTH: ${GEUL_ARGON2_SALT_LENGTH:-16}
      ARGON2_KEY_LENGTH: ${GEUL_ARGON2_KEY_LENGTH:-32}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${GEUL_OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${GEUL_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${GEUL_OTEL_RESOURCE_ATTRIBUTES:-service.namespace=geul,deployment.environment=production}
      GOOGLE_AI_API_KEY: ${GEUL_GOOGLE_AI_API_KEY:?set GEUL_GOOGLE_AI_API_KEY}
    restart: unless-stopped
    networks:
      runtime:
        aliases:
          - geul-api
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  runtime:
    name: ${GEUL_RUNTIME_NETWORK_NAME:-geul-runtime}
    external: true
