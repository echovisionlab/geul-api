version: "2"

run:
  timeout: 15m

linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nestif
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unparam
    - unused
    - wastedassign
  settings:
    funlen:
      lines: 120
      statements: 80
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 6
    errorlint:
      errorf: false
      asserts: true
      comparison: true
    errcheck:
      exclude-functions:
        # Read-side closes: response bodies report nothing useful on Close, and
        # row iteration errors surface through rows.Err (rowserrcheck).
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1008
  exclusions:
    rules:
      # Tests build throwaway requests and fixtures; context plumbing and
      # cleanup error checks there add noise without catching defects, and
      # fixture helpers take constant arguments on purpose.
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - noctx
          - unparam

formatters:
  enable:
    - gofmt

issues:
  new-from-merge-base: origin/main
  max-issues-per-linter: 0
  max-same-issues: 0
