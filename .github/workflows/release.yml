name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The existing deployment bot maintains release PRs; this job owns releases only.
          skip-github-pull-request: true

  publish-image:
    name: Publish Image
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REGISTRY: registry.rawsector.com
      IMAGE_NAME: registry.rawsector.com/echovisionlab/geul-api
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host

      - name: Validate release context
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${RELEASE_TAG}" == "v${RELEASE_VERSION}" ]]
          [[ "${RELEASE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]

      - name: Join the tailnet for the internal registry path
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Resolve the registry to its tailnet address
        env:
          REGISTRY_INTERNAL_ADDRESS: ${{ vars.REGISTRY_INTERNAL_ADDRESS }}
          BUILDKIT_CONTAINER: buildx_buildkit_${{ steps.buildx.outputs.name }}0
        run: |
          : "${REGISTRY_INTERNAL_ADDRESS:?Set the REGISTRY_INTERNAL_ADDRESS repository variable}"
          echo "${REGISTRY_INTERNAL_ADDRESS} registry.rawsector.com" | sudo tee -a /etc/hosts >/dev/null
          # Host networking provides the tailnet route; BuildKit has its own hosts file.
          echo "${REGISTRY_INTERNAL_ADDRESS} registry.rawsector.com" |
            docker exec --interactive --user 0 "${BUILDKIT_CONTAINER}" sh -c 'cat >> /etc/hosts'
          curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' https://registry.rawsector.com/v2/

      - name: Log in to registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Build and push release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          secrets: |
            private_deps_token=${{ secrets.PRIVATE_DEPS_TOKEN }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.ref.name=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=geul-api
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ env.RELEASE_SHA }}
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
