name: CI

on:
  pull_request:
    branches: [main]
  schedule:
    # Nightly full integration catalog (03:30 KST).
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify release metadata
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: python3 .github/scripts/release-scope.py

      - name: Check release scope contracts
        if: steps.scope.outputs.run_full == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_scope.py'

  go-checks:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPRIVATE: github.com/echovisionlab/*
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Configure private Go dependencies
        env:
          TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          : "${TOKEN:?Set the PRIVATE_DEPS_TOKEN repository secret}"
          config="$RUNNER_TEMP/geul-private-deps.gitconfig"
          git config --file "$config" url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=$config" >> "$GITHUB_ENV"

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick ffmpeg
          if ! command -v magick >/dev/null 2>&1; then
            sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          fi
          magick -version

      # Process-lifecycle tests execute a temporary Node fixture. They do not
      # depend on the media workers or their installed packages.
      - name: Set up Node for process tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - name: Test
        run: make test

      # The suite runner's own integration-tagged tests need no services.
      - name: Test integration runner
        run: make test-integration-runner

      - name: Verify media authorization contract
        run: |
          go test -race -covermode=atomic -coverprofile="${RUNNER_TEMP}/mediaauth-coverage.out" ./internal/mediaauth
          go tool cover -func="${RUNNER_TEMP}/mediaauth-coverage.out"
          awk 'NR > 1 && $3 == 0 { print; uncovered = 1 } END { exit uncovered ? 1 : 0 }' "${RUNNER_TEMP}/mediaauth-coverage.out"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Remove private Git credentials
        if: ${{ always() }}
        run: rm -f "$GIT_CONFIG_GLOBAL"

  media-tools:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Media tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up media tools
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          # Writes the user-level npmrc that reads NODE_AUTH_TOKEN; pnpm ignores
          # environment-backed auth in the repository .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: "@echovisionlab"

      - name: Build and test media tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          npm install --global pnpm@12.14.0
          make media-test

      - name: Detect Satori renderer changes
        id: og-render-review
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:media/og/package.json" > "$RUNNER_TEMP/og-base-package.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const baseline = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/og-base-package.json`, 'utf8')).dependencies.satori.replace(/^[~^]/, '');
          const current = JSON.parse(readFileSync('media/og/package.json', 'utf8')).dependencies.satori.replace(/^[~^]/, '');
          if (![baseline, current].every(version => /^\d+\.\d+\.\d+$/.test(version))) throw new Error('Renderer comparison requires exact semantic versions');
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${baseline !== current}\nbaseline_version=${baseline}\n`);
          JS

      - name: Render before and after OG fixtures
        if: ${{ steps.og-render-review.outputs.changed == 'true' }}
        env:
          BASELINE_VERSION: ${{ steps.og-render-review.outputs.baseline_version }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm install --prefix "$RUNNER_TEMP/og-render-baseline" --no-save --ignore-scripts "satori@$BASELINE_VERSION"
          # Keep the archived sources inside tsconfig's src glob so tsx applies
          # the same Hono automatic JSX transform to both template versions.
          baseline_sources="$GITHUB_WORKSPACE/media/og/src/og-render-baseline-ci"
          mkdir -p "$baseline_sources"
          git archive "$BASE_SHA" media/og/src/templates media/og/src/types | tar -x -C "$baseline_sources"
          cd media/og
          pnpm exec tsx scripts/ci/render-og-comparison.mjs "$RUNNER_TEMP/og-render-baseline" "$baseline_sources" "$RUNNER_TEMP/og-render-review"

      - name: Upload OG renderer comparison
        if: ${{ always() && steps.og-render-review.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: og-render-comparison
          path: ${{ runner.temp }}/og-render-review
          if-no-files-found: error
          retention-days: 7

  lint:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPRIVATE: github.com/echovisionlab/*
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Configure private Go dependencies
        env:
          TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          : "${TOKEN:?Set the PRIVATE_DEPS_TOKEN repository secret}"
          config="$RUNNER_TEMP/geul-private-deps.gitconfig"
          git config --file "$config" url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=$config" >> "$GITHUB_ENV"

      - name: Download modules
        run: go mod download

      # Integration-tagged files replace their stubs, so both builds are linted.
      - name: Lint default build
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Lint integration build
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags=integration

      - name: Remove private Git credentials
        if: ${{ always() }}
        run: rm -f "$GIT_CONFIG_GLOBAL"

  integration:
    # Pull requests run the cataloged packages whose test binaries import a
    # changed package; the nightly schedule and manual dispatch run the catalog.
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: geul-api
    env:
      GOPRIVATE: github.com/echovisionlab/*
      GOWORK: "off"
      INTEGRATION_SCHEMA_REVISION: 24cf4de08fca9c4d95a8d471f69dcc39342dd793 # v0.7.0
      INTEGRATION_POSTGRES_IMAGE: registry.rawsector.com/echovisionlab/geul-postgres@sha256:73020bae7decd43b5a00291488740ef307dbd12f405674f0526098df71257138
      # Sibling checkouts the backend band starts (Identity config and Kratos,
      # editor-collab with its local Common/Contracts/Telemetry sources). Pin
      # released revisions; the Kratos image is the one built from that Identity.
      INTEGRATION_IDENTITY_REVISION: 3caf3e5cb3a76403d9bf7e35e8ce6659bca86e32 # v0.3.4
      GEUL_TEST_KRATOS_IMAGE: registry.rawsector.com/echovisionlab/geul-identity-kratos@sha256:e9d06c5765c16c5e4e410bca8cd1abdfb7ce1fd13e772a4e9936fe6c95ba4094
      INTEGRATION_COLLAB_REVISION: 7508b50cafbbdb06a8b767035b5798dd39ce318c # v0.6.10
      INTEGRATION_COMMON_REVISION: 8faddac1a051b786c88f677950c4a415012c837d # v0.11.1
      INTEGRATION_CONTRACTS_REVISION: 95ab5d8007a578c2a98f0fd5d9ba81acfa0f4e73 # v0.14.1
      INTEGRATION_TELEMETRY_REVISION: 11a1a20e47c534e84f5d60e62b917844991562ac # v0.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: geul-api
          # The pull request merge commit and its base parent.
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: geul-api/go.mod
          cache: true
          cache-dependency-path: geul-api/go.sum

      - name: Configure private Go dependencies
        env:
          TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          : "${TOKEN:?Set the PRIVATE_DEPS_TOKEN repository secret}"
          config="$RUNNER_TEMP/geul-private-deps.gitconfig"
          git config --file "$config" url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=$config" >> "$GITHUB_ENV"

      - name: Download modules
        run: go mod download

      - name: Select integration packages
        id: select
        run: |
          set -euo pipefail
          selection=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The checkout is the merge commit; its first parent is the base.
            selection=(--changed-from HEAD^1)
          fi
          go run -tags=integration ./scripts/test/integration "${selection[@]}" --list | tee "$RUNNER_TEMP/integration-selection.txt"
          go run -tags=integration ./scripts/test/integration "${selection[@]}" --list-images > "$RUNNER_TEMP/integration-images.txt"
          {
            echo "selection=${selection[*]}"
            if [ -s "$RUNNER_TEMP/integration-selection.txt" ]; then echo "run=true"; else echo "run=false"; fi
            if grep -Eq '^(ory|serial) \(' "$RUNNER_TEMP/integration-selection.txt"; then echo "backend=true"; else echo "backend=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Checkout reviewed schema
        if: steps.select.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: echovisionlab/geul-schema
          ref: ${{ env.INTEGRATION_SCHEMA_REVISION }}
          path: geul-schema
          token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
          persist-credentials: false

      - name: Checkout Identity
        if: steps.select.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: echovisionlab/geul-identity
          ref: ${{ env.INTEGRATION_IDENTITY_REVISION }}
          path: geul-identity
          token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
          persist-credentials: false

      - name: Checkout editor collaboration
        if: steps.select.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: echovisionlab/geul-editor-collab
          ref: ${{ env.INTEGRATION_COLLAB_REVISION }}
          path: geul-editor-collab
          token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
          persist-credentials: false

      - name: Checkout Common
        if: steps.select.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: echovisionlab/geul-common
          ref: ${{ env.INTEGRATION_COMMON_REVISION }}
          path: geul-common
          token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
          persist-credentials: false

      - name: Checkout event contracts
        if: steps.select.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: echovisionlab/geul-event-contracts
          ref: ${{ env.INTEGRATION_CONTRACTS_REVISION }}
          path: geul-event-contracts
          token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
          persist-credentials: false

      - name: Checkout Telemetry
        if: steps.select.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: echovisionlab/geul-telemetry
          ref: ${{ env.INTEGRATION_TELEMETRY_REVISION }}
          path: geul-telemetry
          token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
          persist-credentials: false

      - name: Set up Node
        if: steps.select.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          # Writes the user-level npmrc that reads NODE_AUTH_TOKEN; pnpm ignores
          # environment-backed auth in the repository .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: "@echovisionlab"

      - name: Install media tools
        if: steps.select.outputs.run == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          sudo apt-get update
          # cwebp builds the client media fixtures the runtime upload tests send.
          sudo apt-get install --yes imagemagick ffmpeg webp
          if ! command -v magick >/dev/null 2>&1; then
            sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          fi
          npm install --global pnpm@12.14.0
          make media-build

      - name: Install collaboration sources
        if: steps.select.outputs.backend == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          for repository in geul-common geul-event-contracts geul-telemetry geul-editor-collab; do
            pnpm --dir "$repository" install --frozen-lockfile
          done

      - name: Join the tailnet for the test image registry
        if: steps.select.outputs.run == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Resolve the test image registry
        if: steps.select.outputs.run == 'true'
        env:
          REGISTRY_INTERNAL_ADDRESS: ${{ vars.REGISTRY_INTERNAL_ADDRESS }}
        run: |
          : "${REGISTRY_INTERNAL_ADDRESS:?Set the REGISTRY_INTERNAL_ADDRESS repository variable}"
          echo "${REGISTRY_INTERNAL_ADDRESS} registry.rawsector.com" | sudo tee -a /etc/hosts >/dev/null

      - name: Log in to the test image registry
        if: steps.select.outputs.run == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.rawsector.com
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Pull integration images
        if: steps.select.outputs.run == 'true'
        run: xargs -n 1 docker pull --quiet < "$RUNNER_TEMP/integration-images.txt"

      - name: Run integration tests
        if: steps.select.outputs.run == 'true'
        env:
          SELECTION: ${{ steps.select.outputs.selection }}
        run: |
          # SELECTION is either empty or "--changed-from HEAD^1".
          # shellcheck disable=SC2086
          go run -tags=integration ./scripts/test/integration $SELECTION \
            --schema-root "$GITHUB_WORKSPACE/geul-schema" \
            --postgres-image "$INTEGRATION_POSTGRES_IMAGE" \
            --jobs 4

      - name: Remove private Git credentials
        if: ${{ always() }}
        run: rm -f "$GIT_CONFIG_GLOBAL"

  validate:
    # Version-only Release Please PRs require the scope check. Every other
    # run requires the Go, lint, media and integration jobs.
    name: Validate
    runs-on: ubuntu-latest
    needs: [scope, go-checks, lint, media-tools, integration]
    if: ${{ always() }}
    steps:
      - name: Require every validation job
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_FULL: ${{ needs.scope.outputs.run_full }}
          GO_RESULT: ${{ needs.go-checks.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          MEDIA_RESULT: ${{ needs.media-tools.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          for result in "$GO_RESULT" "$LINT_RESULT" "$MEDIA_RESULT" "$INTEGRATION_RESULT"; do
            if [ "$RUN_FULL" = true ]; then
              test "$result" = success
            else
              test "$result" = skipped
            fi
          done
