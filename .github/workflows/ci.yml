name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      integration_smoke:
        description: Run focused PostgreSQL integration smoke tests
        type: boolean
        default: true
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify release metadata
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: python3 .github/scripts/release-scope.py

      - name: Check release scope contracts
        if: steps.scope.outputs.run_full == 'true'
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_scope.py'

  go-checks:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPRIVATE: github.com/echovisionlab/*
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Configure private Go dependencies
        env:
          TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          : "${TOKEN:?Set the PRIVATE_DEPS_TOKEN repository secret}"
          config="$RUNNER_TEMP/geul-private-deps.gitconfig"
          git config --file "$config" url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=$config" >> "$GITHUB_ENV"

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick ffmpeg
          if ! command -v magick >/dev/null 2>&1; then
            sudo ln -s "$(command -v convert)" /usr/local/bin/magick
          fi
          magick -version

      # Process-lifecycle tests execute a temporary Node fixture. They do not
      # depend on the media workers or their installed packages.
      - name: Set up Node for process tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"

      - name: Test
        run: make test

      - name: Verify media authorization contract
        run: |
          go test -race -covermode=atomic -coverprofile="${RUNNER_TEMP}/mediaauth-coverage.out" ./internal/mediaauth
          go tool cover -func="${RUNNER_TEMP}/mediaauth-coverage.out"
          awk 'NR > 1 && $3 == 0 { print; uncovered = 1 } END { exit uncovered ? 1 : 0 }' "${RUNNER_TEMP}/mediaauth-coverage.out"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Remove private Git credentials
        if: ${{ always() }}
        run: rm -f "$GIT_CONFIG_GLOBAL"

  media-tools:
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    name: Media tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up media tools
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.0"
          # Writes the user-level npmrc that reads NODE_AUTH_TOKEN; pnpm ignores
          # environment-backed auth in the repository .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: "@echovisionlab"

      - name: Build and test media tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          npm install --global pnpm@12.14.0
          make media-test

      - name: Detect Satori renderer changes
        id: og-render-review
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:media/og/package.json" > "$RUNNER_TEMP/og-base-package.json"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const baseline = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/og-base-package.json`, 'utf8')).dependencies.satori.replace(/^[~^]/, '');
          const current = JSON.parse(readFileSync('media/og/package.json', 'utf8')).dependencies.satori.replace(/^[~^]/, '');
          if (![baseline, current].every(version => /^\d+\.\d+\.\d+$/.test(version))) throw new Error('Renderer comparison requires exact semantic versions');
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${baseline !== current}\nbaseline_version=${baseline}\n`);
          JS

      - name: Render before and after OG fixtures
        if: ${{ steps.og-render-review.outputs.changed == 'true' }}
        env:
          BASELINE_VERSION: ${{ steps.og-render-review.outputs.baseline_version }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm install --prefix "$RUNNER_TEMP/og-render-baseline" --no-save --ignore-scripts "satori@$BASELINE_VERSION"
          # Keep the archived sources inside tsconfig's src glob so tsx applies
          # the same Hono automatic JSX transform to both template versions.
          baseline_sources="$GITHUB_WORKSPACE/media/og/src/og-render-baseline-ci"
          mkdir -p "$baseline_sources"
          git archive "$BASE_SHA" media/og/src/templates media/og/src/types | tar -x -C "$baseline_sources"
          cd media/og
          pnpm exec tsx scripts/ci/render-og-comparison.mjs "$RUNNER_TEMP/og-render-baseline" "$baseline_sources" "$RUNNER_TEMP/og-render-review"

      - name: Upload OG renderer comparison
        if: ${{ always() && steps.og-render-review.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: og-render-comparison
          path: ${{ runner.temp }}/og-render-review
          if-no-files-found: error
          retention-days: 7

  integration-smoke:
    name: PostgreSQL integration smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.integration_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOPRIVATE: github.com/echovisionlab/*
      GOWORK: "off"
      INTEGRATION_SCHEMA_REVISION: f68cf0b0c0de6d0542b38fccc5fc4eaf169609b6
      INTEGRATION_POSTGRES_IMAGE: registry.rawsector.com/echovisionlab/geul-postgres@sha256:73020bae7decd43b5a00291488740ef307dbd12f405674f0526098df71257138
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout reviewed schema
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: echovisionlab/geul-schema
          ref: ${{ env.INTEGRATION_SCHEMA_REVISION }}
          path: .integration-schema
          token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Configure private Go dependencies
        env:
          TOKEN: ${{ secrets.PRIVATE_DEPS_TOKEN }}
        run: |
          : "${TOKEN:?Set the PRIVATE_DEPS_TOKEN repository secret}"
          config="$RUNNER_TEMP/geul-private-deps.gitconfig"
          git config --file "$config" url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=$config" >> "$GITHUB_ENV"

      - name: Download modules
        run: go mod download

      - name: Join the tailnet for the test image registry
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Resolve the test image registry
        env:
          REGISTRY_INTERNAL_ADDRESS: ${{ vars.REGISTRY_INTERNAL_ADDRESS }}
        run: |
          : "${REGISTRY_INTERNAL_ADDRESS:?Set the REGISTRY_INTERNAL_ADDRESS repository variable}"
          echo "${REGISTRY_INTERNAL_ADDRESS} registry.rawsector.com" | sudo tee -a /etc/hosts >/dev/null

      - name: Log in to the test image registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.rawsector.com
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Pull reviewed PostgreSQL image
        run: docker pull "$INTEGRATION_POSTGRES_IMAGE"

      - name: Verify isolated PostgreSQL fixtures and integration contracts
        run: |
          # Each native runner invocation first verifies distinct logical databases,
          # committed-row isolation, independent cleanup, and database removal.
          # Only the selected DB package runs; Ory/runtime backends are not started.
          for package in ./internal/mq ./internal/telemetry ./internal/transcode/application; do
            go run -tags=integration ./scripts/test/integration \
              --schema-root "$GITHUB_WORKSPACE/.integration-schema" \
              --postgres-image "$INTEGRATION_POSTGRES_IMAGE" \
              --jobs 2 --package "$package"
          done

      - name: Remove private Git credentials
        if: ${{ always() }}
        run: rm -f "$GIT_CONFIG_GLOBAL"

  validate:
    # Version-only Release Please PRs require the scope check. Ordinary PRs
    # require both suites; a requested dispatch smoke must also pass.
    name: Validate
    runs-on: ubuntu-latest
    needs: [scope, go-checks, media-tools, integration-smoke]
    if: ${{ always() }}
    steps:
      - name: Require every validation job
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_FULL: ${{ needs.scope.outputs.run_full }}
          GO_RESULT: ${{ needs.go-checks.result }}
          MEDIA_RESULT: ${{ needs.media-tools.result }}
          SMOKE_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.integration_smoke }}
          SMOKE_RESULT: ${{ needs.integration-smoke.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          if [ "$RUN_FULL" = true ]; then
            test "$GO_RESULT" = success
            test "$MEDIA_RESULT" = success
          else
            test "$GO_RESULT" = skipped
            test "$MEDIA_RESULT" = skipped
          fi
          if [ "$SMOKE_REQUIRED" = true ]; then
            test "$SMOKE_RESULT" = success
          else
            test "$SMOKE_RESULT" = skipped
          fi
